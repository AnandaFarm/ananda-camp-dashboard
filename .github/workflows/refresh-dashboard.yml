name: Refresh camp dashboard

# Runs once a day at 11:00 UTC (~6 AM Florida / 7 AM EDT) and also lets you
# trigger a manual run from the Actions tab via the "Run workflow" button.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

# Allow the job to push the updated index.html back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build dashboard from TicketSpice API
        env:
          TICKETSPICE_API_KEY: ${{ secrets.TICKETSPICE_API_KEY }}
        run: python build_dashboard.py

      - name: Commit updated dashboard (only if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes to index.html — nothing to commit."
          else
            git add index.html
            git commit -m "Auto-refresh dashboard ($(date -u +%Y-%m-%d))"
            git push
          fi
